tItem('mono_style_archive_v06',JSON.stringify(owned))}function cardHTML(c){return `<div class="card ${c.rarity}" data-id="${c.id}" onclick="detail('${c.id}')"><img src="${c.img}" alt="${esc(c.name)}"><span class="rarity">${c.rarity}</span>${owned[c.id]?`<span class="owned">×${owned[c.id]}</span>`:''}<div class="meta"><b>${esc(c.name)}</b><small>${c.id} · ${esc(c.cat)}</small></div></div>`}function stats(){return `<div class="stats"><div><strong>${cards.length}</strong><span>獨立素材卡</span></div><div><strong>${Object.keys(owned).length}</strong><span>已解鎖圖鑑</span></div><div><strong>${cards.filter(c=>c.cat==='人物').length}</strong><span>角色身份錨點</span></div></div>`}function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));if(page==='home'){app.innerHTML=`<section class="hero"><div class="eyebrow">SERIES 001 / MATERIAL COLLECTION</div><h1>STYLE ARCHIVE</h1><p>獨立角色卡 × 服裝卡 × 髮型卡 × 妝容卡 × 動作卡。所有卡牌來自你上傳的原始素材，按單張收錄，混合規則可用於未來的創作工作台。</p>${stats()}<div class="controls"><button class="btn primary" onclick="go('packs')">進入卡包中心 ↗</button><button class="btn" onclick="go('library')">查看完整卡池</button></div></section><h2>Featured cards</h2><div class="grid">${cards.slice(0,10).map(cardHTML).join('')}</div>`}else if(page==='packs'){renderPack()}else{let pool=page==='collection'?cards.filter(c=>owned[c.id]):cards;let visible=pool.filter(c=>(filter==='全部'||c.cat===filter)&&(sort==='全部'||c.rarity===sort));app.innerHTML=`<div class="eyebrow">${page==='collection'?'MY COLLECTION':'CARD CATALOGUE'}</div><h1>${page==='collection'?'收藏圖鑑':'完整卡池'}</h1><p>${page==='collection'?'開包獲得的卡牌會自動保存於這台瀏覽器。':'所有素材獨立成卡，點擊可查看原始素材與所屬類型。'}</p>${stats()}<div class="controls"><select id="cat" onchange="filter=this.value;render()">${categories.map(c=>`<option ${filter===c?'selected':''}>${c}</option>`).join('')}</select><select onchange="sort=this.value;render()">${['全部','RR','SR','SAR','UR'].map(c=>`<option ${sort===c?'selected':''}>${c}</option>`).join('')}< );return a[Math.floor(Math.random()*a.length)]||pool[Math.floor(Math.random()*pool.length)]});draw.forEach(c=>owned[c.id]=(owned[c.id]||0)+1);save();index=0;stage='reveal';render()}function nextCard(){if(index<draw.length-1)index++;else stage='result';render()}function detail(id){let c=cards.find(c=>c.id===id);document.getElementById('modal').innerHTML=`<div class="dialog" onclick="if(event.target===this)closeDetail()"><div class="dialogbox"><button class="btn close" onclick="closeDetail()">✕</button><div class="detail"><img src="${c.img}"><div><div class="eyebrow">${c.id} / ${c.rarity}</div><h2>${esc(c.name)}</h2><p>類型：${esc(c.cat)}<br>使用規則：${esc(c.owner)}<br>收藏數量：${owned[c.id]||0}</p><p>${esc(c.desc||'原始參考素材卡。尚未製作角色穿搭合成藝術圖。')}</p><button class="btn primary" onclick="closeDetail()">返回卡冊</button></div></div></div></div>`}function closeDetail(){document.getElementById('modal').innerHTML=''}function resetCollection(){if(confirm('確定清除這台瀏覽器中的示範收藏嗎？')){owned={};save();render()}}render();
